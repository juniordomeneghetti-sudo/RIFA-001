<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rifa Compartilhada</title>

<style>
body{
  font-family:Arial,sans-serif;
  padding:15px;
  margin: 0;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  background-color: #0f172a;
  background-image: 
    radial-gradient(circle at 50% 30%, rgba(255, 255, 255, 0.08) 0%, transparent 60%),
    radial-gradient(circle at 20% 80%, rgba(42, 157, 143, 0.05) 0%, transparent 40%),
    radial-gradient(circle at 80% 80%, rgba(230, 57, 70, 0.05) 0%, transparent 40%);
  background-attachment: fixed;
}
h1{
  text-align:center;
  margin-bottom:5px;
}
h2{
  text-align:center;
  font-family: 'Arial Black', Impact, sans-serif;
  font-size: 3.5rem;
  font-weight: 900;
  text-transform: uppercase;
  letter-spacing: 2px;
  background: linear-gradient(135deg, #e63946 25%, #ffffff 25%, #ffffff 50%, #2a9d8f 50%, #2a9d8f 75%, #ffffff 75%);
  background-size: 40px 40px;
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  text-shadow: 0px 4px 10px rgba(0,0,0,0.5), 0px 0px 20px rgba(230,57,70,0.4);
}
.sub{
  text-align:center;
  font-size:20px;
  font-weight:bold;
  color:#0a7d2c;
  margin-bottom:20px;
}
.Casa_Caridade{
  text-align:center;
  font-size:27px;
  font-weight:bold;
  color:#D62828;
  margin-bottom:20px;
}
.pix{
  text-align:center;
  font-size:15px;
  font-weight:bold;
  color:#0a7d2c;
  margin-bottom:5px;
}
.respons{
  text-align:center;
  font-size:12px;
  color:#0a7d2c;
  margin-bottom:20px;
}
.cards{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
  margin-bottom:15px;
}
.card{
  background:white;
  padding:15px;
  border-radius:10px;
  text-align:center;
  box-shadow:0 0 6px rgba(0,0,0,.15);
}
.card h3{
  margin:0;
  font-size:14px;
}
.card span{
  font-size:28px;
  font-weight:bold;
}
.botoes{
  display:flex;
  gap:10px;
  justify-content:center;
  margin-bottom:15px;
  flex-wrap:wrap;
}
button{
  border:none;
  border-radius:8px;
  padding:10px 14px;
  cursor:pointer;
  font-size:14px;
}
.admin{background:#222;color:white;}
.sair{background:#666;color:white;}
.reset{background:#c62828;color:white;}
input{
  width:100%;
  padding:8px;
  border-radius:6px;
  border:1px solid #ccc;
  box-sizing:border-box;
}
table{
  width:100%;
  border-collapse:collapse;
  background:white;
  border-radius:10px;
  overflow:hidden;
}
th{
  background:#222;
  color:white;
  padding:10px;
}
td{
  padding:8px;
  border:1px solid #ddd;
  text-align:center;
}
.disponivel{background:white;}
.reservado{background:#fff7d6;}
.pago{background:#c8f7c5;}
.tag{
  font-weight:bold;
}
.verde{color:#0a7d2c;}
.amarelo{color:#b8860b;}
.azul{color:#1565c0;}
@media(max-width:700px){
  .cards{grid-template-columns:1fr;}
  table{font-size:12px;}
}
</style>
</head>

<body>

<h1>RIFA 004</h1>
<h2>Campanha Final de Ano</h2>
<div class="sub">Prêmio: Patinete Elétrico ou PIX ($1.300)</div>
<div class="Casa_Caridade"> Casa de Caridade C.P.R.</div>
<h3 class="pix">PIX (PAGAMENTO): 172.042.468-37 </h3>
<div class="respons"> NOME: WINDER CEZAR BORDON </div>

<div class="cards">
  <div class="card"><h3>Disponíveis</h3><span id="disp">0</span></div>
  <div class="card"><h3>Reservados</h3><span id="res">0</span></div>
  <div class="card"><h3>Pagos</h3><span id="pag">0</span></div>
</div>

<!-- <input id="pesquisa" placeholder="Pesquisar nome..." onkeyup="filtrar()"> -->

<div class="botoes">
  <button class="admin" onclick="loginAdmin()">Login Admin</button>
  <button class="sair" id="btnSair" style="display:none" onclick="logoutAdmin()">Sair</button>
  <button class="reset" id="btnReset" style="display:none" onclick="resetar()">Reset Geral</button>
</div>

<table>
  <thead>
    <tr>
      <th>Nome</th>
      <th>Comprador</th>
      <th>Status</th>
      <th>Ação</th>
    </tr>
  </thead>
  <tbody id="tabela"></tbody>
</table>

<script>

const API = "https://script.google.com/macros/s/AKfycbxul6neaXASt-kFCc4AcHpztykUVTvykoz7dvCOEirrD2YC4mp8qHllyEdl_PMLgU0C/exec";
const SENHA = "Axé2026";

let admin = false;
let lista = [];
async function carregar() {
  const r = await fetch(API);
  lista = await r.json();
  render();
}

async function salvar(item) {
  await fetch(API, {
    method: "POST",
    body: JSON.stringify(item)
  });
}

function atualizarPainel() {
  let d = 0, r = 0, p = 0;

  lista.forEach(i => {
    if (i.pago) p++;
    else if (i.travado) r++;
    else d++;
  });

  document.getElementById("disp").innerText = d;
  document.getElementById("res").innerText = r;
  document.getElementById("pag").innerText = p;
}

function render() {
  const tbody = document.getElementById("tabela");
  tbody.innerHTML = "";

  lista.forEach((item, i) => {
    const tr = document.createElement("tr");

    if (item.pago) tr.className = "pago";
    else if (item.travado) tr.className = "reservado";
    else tr.className = "disponivel";

    let status = "";
    let acao = "";

    if (item.pago) {
      status = '<span class="tag verde">PAGO</span>';
      acao = "Pago confirmado";
    }

    else if (item.travado) {
      status = '<span class="tag amarelo">RESERVADO</span>';

      if (admin) {
        acao = `
          <button style="background:#2e7d32;color:white"
            onclick="confirmarPago(${i})">PIX</button>

          <button style="background:#c62828;color:white"
            onclick="liberar(${i})">Liberar</button>
        `;
      } else {
        acao = "Aguardando PIX";
      }
    }

    else {
      status = '<span class="tag azul">DISPONÍVEL</span>';

      acao = `
        <input id="comp${i}" placeholder="Seu nome">
        <br><br>
        <button style="background:#1565c0;color:white"
          onclick="reservar(${i})">Reservar</button>
      `;
    }

    tr.innerHTML = `
      <td>${item.nome}</td>
      <td>${item.comprador || "-"}</td>
      <td>${status}</td>
      <td>${acao}</td>
    `;

    tbody.appendChild(tr);
  });

  atualizarPainel();
}
async function reservar(i) {

  if (lista[i].travado) {
    alert("Este nome já foi reservado.");
    return;
  }

  const input = document.getElementById(`comp${i}`);
  const nome = input.value.trim();

  if (!nome) {
    input.focus();
    return;
  }

  // Desabilita para evitar duplo clique
  input.disabled = true;

  lista[i].comprador = nome;
  lista[i].travado = true;

  await salvar(lista[i]);

  // Fecha o teclado após salvar
  input.blur();

  await carregar();
}

async function liberar(i) {

  if (!admin) return;

  if (lista[i].pago) {
    alert("Não é possível liberar um nome já pago.");
    return;
  }

  if (!confirm("Liberar esta reserva?")) return;

  lista[i].comprador = "";
  lista[i].travado = false;

  await salvar(lista[i]);
  await carregar();
}

async function confirmarPago(i) {

  if (!admin) return;

  if (!confirm("Confirmar recebimento do PIX?")) return;

  lista[i].pago = true;

  await salvar(lista[i]);
  await carregar();
}
function loginAdmin() {

  const s = prompt("Senha do administrador:");

  if (s !== SENHA) {
    alert("Senha incorreta.");
    return;
  }

  admin = true;

  document.getElementById("btnSair").style.display = "inline-block";
  document.getElementById("btnReset").style.display = "inline-block";

  render();
}

function logoutAdmin() {

  admin = false;

  document.getElementById("btnSair").style.display = "none";
  document.getElementById("btnReset").style.display = "none";

  render();
}

function filtrar() {

  const texto = document.getElementById("pesquisa").value.toLowerCase();

  document.querySelectorAll("tbody tr").forEach(tr => {

    const nome = tr.children[0].innerText.toLowerCase();

    tr.style.display = nome.includes(texto) ? "" : "none";
  });
}

async function resetar() {

  if (!admin) return;

  const ok = confirm(
    "ATENÇÃO!\\n\\n" +
    "Isso vai apagar TODOS os compradores, " +
    "remover TODOS os pagamentos e liberar TODOS os nomes.\\n\\n" +
    "Deseja continuar?"
  );

  if (!ok) return;

  for (const item of lista) {

    item.comprador = "";
    item.travado = false;
    item.pago = false;

    await salvar(item);
  }

  await carregar();

  alert("Rifa resetada com sucesso!");
}
carregar();

setInterval(() => { 
  if (document.activeElement.tagName !== 'INPUT')
  { carregar(); 
  } 
}, 5000);
</script>

</body>
</html>
